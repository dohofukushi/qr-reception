<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>無人受付システム</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

#reader{
  width:700px;
  max-width:95%;
  margin:auto;
}

#status{
  margin-top:20px;
  font-size:40px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>QRコードをかざしてください</h1>

<div id="reader"></div>

<div id="status">待機中...</div>

<script>

let busy = false;

function resetScreen() {

  document.getElementById("status").innerHTML =
    "QRコードをかざしてください";

  busy = false;
}

function onScanSuccess(decodedText){

  if (busy) return;

  busy = true;

  document.getElementById("status").innerHTML =
    "受付処理中...";

  window.open(decodedText,"_blank");

  setTimeout(function(){

    document.getElementById("status").innerHTML =
      "✅受付完了";

    setTimeout(function(){

      resetScreen();

    },3000);

  },1000);

}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode: "environment" },
  {
    fps:20,
    qrbox:350
  },
  onScanSuccess
);

</script>

</body>
</html>
