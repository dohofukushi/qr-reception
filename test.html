<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR受付システム</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@rcode.min.jsscript>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

#reader{
  width:500px;
  max-width:95%;
  margin:auto;
}

#status{
  margin-top:20px;
  font-size:36px;
  font-weight:bold;
}
</style>

</head>
<body>

<h1>QRコードをかざしてください</h1>

<div id="reader"></div>

<div id="status">起動中...</div>

<script>

function onScanSuccess(decodedText){

  document.getElementById("status").innerHTML =
    "読取成功<br>" + decodedText;

}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: 250
  },
  onScanSuccess
).catch(err => {

  document.getElementById("status").innerHTML =
    "カメラ起動失敗";

  console.error(err);

});

</script>

</body>
</html>
