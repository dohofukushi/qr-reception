<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR受付システム</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

#reader{
  width:700px;
  max-width:95%;
  margin:auto;
}

#status{
  margin-top:20px;
  font-size:30px;
  font-weight:bold;
}
</style>

</head>
<body>

<h1>QRコードをかざしてください</h1>

<div id="reader"></div>

<div id="status">起動中...</div>

<script>
function onScanSuccess(decodedText){
  document.getElementById("status").innerHTML =
    "読取成功<br>" + decodedText;
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "user" },
  {
    fps: 10,
    qrbox: 350
  },
  onScanSuccess
).catch(err => {

  document.getElementById("status").innerHTML =
    "カメラ起動失敗";

  console.error(err);

});
</script>

</body>
</html>
