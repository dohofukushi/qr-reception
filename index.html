<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR受付システム</title>

<script srckg.com/html5-qrcodescript>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:sans-serif;
  text-align:center;
}

h1{
  font-size:50px;
  margin-top:20px;
}

#reader{
  width:500px;
  max-width:90%;
  margin:auto;
}

#status{
  font-size:60px;
  font-weight:bold;
  margin-top:20px;
}

.ok{
  color:green;
}

.wait{
  color:black;
}
</style>
</head>

<body>

<h1>QRコードをかざしてください</h1>

<div id="reader"></div>

<div id="status" class="wait">待機中</div>

<script>

let busy = false;

function resetScreen() {
  document.getElementById("status").innerHTML = "待機中";
  document.getElementById("status").className = "wait";
  busy = false;
}

function onScanSuccess(decodedText) {

  if (busy) return;

  busy = true;

  fetch(decodedText,{mode:"no-cors"})
    .finally(() => {

      document.getElementById("status").innerHTML =
        "✅ 受付完了";

      document.getElementById("status").className =
        "ok";

      setTimeout(resetScreen,3000);

    });
}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: 250
  },
  onScanSuccess
).catch(err => {

  document.getElementById("status").innerHTML =
    "カメラを許可してください";

  console.log(err);

});
</script>

</body>
</html>
